    endPrimitive: LegoBlockTopPanel
    points:
      - 120, 350
      - 120, 460
    properties:
      InitialMultiplicity: 1
      StartMultTxt: 0..1
      EndMultTxt: '*'
      StartRoleTxt: +SocketStandard
  - type: Association
    startPrimitive: LegoPanelAngle
    endPrimitive: LegoBlockCustomPanel
