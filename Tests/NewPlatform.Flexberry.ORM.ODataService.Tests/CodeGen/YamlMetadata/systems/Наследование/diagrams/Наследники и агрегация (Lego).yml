      - 430, 560
      - 430, 810
    properties:
      StartMultTxt: 1
      EndMultTxt: '*'
      StartRoleTxt: +Block
      EndRoleTxt: +CustomPanels
  - type: Composition
    startPrimitive: LegoBlock
    endPrimitive: LegoBlockBottomPanel
