diagramType: CAD
name: Наследники и агрегация (Lego)
primitives:
  - type: Composition
    startPrimitive: /BaseLegoBlock
    endPrimitive: LegoPatent
    points:
      - 470, 160
      - 670, 160
    properties:
      StartMultTxt: 1
      EndMultTxt: '*'
      EndRoleTxt: +Patents
  - type: CADClass
    caseName: LegoBlock
    x: 310
    y: 440
    width: 130
    height: 120
    properties:
      Name: LegoBlock
      AttributesTxt: >-
        +Width:int

        +Height:int

        +Depth:int

        +Configuration:string
      MethodsTxt: ' '
      StereotypeTxt: ' '
  - type: CADClass
    caseName: LegoPatent
    x: 650
    y: 100
    width: 120
    height: 120
    properties:
      Name: LegoPatent
      AttributesTxt: >-
        +Name:string

        +Date:DateTime

        +Authors:string

        +Description:string
      MethodsTxt: ' '
      StereotypeTxt: ' '
  - type: CADClass
    caseName: LegoBlockTopPanel
    x: 60
    y: 440
    width: 140
    height: 90
    properties:
      Name: LegoBlockTopPanel
      AttributesTxt: >-
        +WidthCount:int

        +HeightCount:int
      MethodsTxt: ' '
      StereotypeTxt: ' '
  - type: CADClass
    caseName: LegoBlockBottomPanel
    x: 240
    y: 620
    width: 160
    height: 90
    properties:
      Name: LegoBlockBottomPanel
      AttributesTxt: >-
        +WidthCount:int

        +HeightCount:int
      MethodsTxt: ' '
      StereotypeTxt: ' '
  - type: CADClass
    caseName: LegoPanelAngle
    x: 100
    y: 750
    width: 120
    height: 90
    properties:
      Name: LegoPanelAngle
      AttributesTxt: >-
        +Name:string

        +Angle:int
      MethodsTxt: ' '
      StereotypeTxt: ' '
  - type: CADClass
    caseName: LegoMaterial
    x: 260
    y: 290
    width: 100
    height: 90
    properties:
      Name: LegoMaterial
      AttributesTxt: +Name:string
      MethodsTxt: ' '
      StereotypeTxt: ' '
  - type: CADClass
    caseName: LegoBlockColor
    x: 110
    y: 100
    width: 120
    height: 90
    properties:
      Name: LegoBlockColor
      AttributesTxt: >-
        +Name:string

        +ColorNumber:int
      MethodsTxt: ' '
      StereotypeTxt: ' '
  - type: CADClass
    caseName: LegoDevice
    x: 450
    y: 300
    width: 130
    height: 90
    properties:
      Name: LegoDevice
      AttributesTxt: >-
        +Description:string

        +Electricity:bool
      MethodsTxt: ' '
      StereotypeTxt: ' '
  - type: Composition
    startPrimitive: LegoBlockTopPanel
    endPrimitive: LegoBlockTopPanelHole
    points:
      - 130, 520
      - 130, 640
    properties:
      StartMultTxt: 1
      EndMultTxt: '*'
      StartRoleTxt: +TopPanel
      EndRoleTxt: +Holes
  - type: Inheritance
    startPrimitive: /BaseLegoBlock
    endPrimitive: LegoBlock
    points:
      - 390, 180
      - 390, 460
  - type: Association
    startPrimitive: LegoBlockColor
    endPrimitive: /BaseLegoBlock
    points:
      - 200, 150
      - 400, 150
    properties:
      InitialMultiplicity: 1
      StartMultTxt: 0..1
      EndMultTxt: '*'
      StartRoleTxt: +Color
  - type: Note
    caseName: 'Учёт конструкторов и блоков Lego '
    x: 190
    y: 20
    width: 228
    height: 30
    properties:
      Name: 'Учёт конструкторов и блоков Lego '
  - type: Inheritance
    startPrimitive: /BaseLegoBlock
    endPrimitive: LegoDevice
    points:
      - 460, 180
      - 460, 310
  - type: CADClass
    caseName: /BaseLegoBlock
    x: 370
    y: 100
    width: 110
    height: 90
    properties:
      Name: /BaseLegoBlock
      AttributesTxt: >-
        Name:string

        BlockId:int
      MethodsTxt: ' '
      StereotypeTxt: ' '
  - type: Association
    startPrimitive: LegoMaterial
    endPrimitive: LegoBlock
    points:
      - 330, 360
      - 330, 450
    properties:
      InitialMultiplicity: 1
      StartMultTxt: 0..1
      EndMultTxt: '*'
      StartRoleTxt: +Material
  - type: Composition
    startPrimitive: LegoBlock
    endPrimitive: LegoBlockCustomPanel
