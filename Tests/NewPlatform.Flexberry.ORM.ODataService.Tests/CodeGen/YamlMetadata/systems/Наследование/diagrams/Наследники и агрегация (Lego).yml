    y: 750
    width: 160
    height: 90
    properties:
      Name: LegoBlockCustomPanel
      AttributesTxt: >-
        +Orientation:string

        +Position:string
      MethodsTxt: ' '
      StereotypeTxt: ' '
  - type: CADClass
