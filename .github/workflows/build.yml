name: CI

on:
  push:
    branches: [ release-v6.1.01 ]
  pull_request:
    branches: [ release-v6.1.01 ]
  workflow_dispatch:

env:
  XUNIT_RUNNER: "2.4.1"
  CONFIGURATION: "Debug"
  NUPATH: "https://api.nuget.org/v3/index.json"

jobs:
  build:
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: flexberry/alt.p8-postgresql-postgis
        env:
          POSTGRES_PASSWORD: p@ssw0rd
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4

    # ✅ Setup both 3.1 (for tests) and 8.0 (for tooling)
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          3.1.x
          8.0.x

    - name: Restore solution
      run: dotnet restore NewPlatform.Flexberry.ORM.ODataService.sln -s $NUPATH
      
    - name: Install xunit.runner.console
      run: nuget install xunit.runner.console -Version $XUNIT_RUNNER -OutputDirectory testrunner -Source $NUPATH
      
    - name: Build
      run: dotnet build --no-restore -v q /p:WarningLevel=0 -c $CONFIGURATION NewPlatform.Flexberry.ORM.ODataService.sln

    # ✅ Run tests via project file (more reliable than DLL path)
    - name: Test
      run: dotnet test Tests/NewPlatform.Flexberry.ORM.ODataService.Tests/NewPlatform.Flexberry.ORM.ODataService.Tests.csproj -c $CONFIGURATION --no-build --framework netcoreapp3.1